<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b4bdb">
  <meta name="description" content="小学生が楽しく九九に挑戦できる、60秒のスピード計算ゲームです。">
  <title>九九ダッシュ！</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235b4bdb'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='40' font-weight='900' fill='white'%3E%C3%97%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --ink:#29304a; --muted:#68708d; --purple:#5b4bdb; --purple-dark:#4135a8;
      --orange:#ff6b35; --orange-dark:#d94718; --yellow:#ffd84d; --mint:#48d6b5;
      --sky:#69c9ff; --paper:#fff; --cream:#fff9e9; --line:#e7e2f5;
      font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    }
    * { box-sizing:border-box; }
    html { height:100%; overscroll-behavior:none; }
    body { margin:0; min-height:100vh; color:var(--ink); overscroll-behavior:none; background:
      radial-gradient(circle at 8% 10%,rgba(255,255,255,.85) 0 34px,transparent 36px),
      radial-gradient(circle at 91% 18%,rgba(255,255,255,.65) 0 48px,transparent 50px),
      linear-gradient(145deg,#fff0a9 0%,#bff6e8 49%,#dcd1ff 100%); }
    body.game-running { position:fixed; inset:0; width:100%; height:100%; overflow:hidden; }
    body.game-running .app { width:min(100% - 12px,1100px); height:100vh; height:100dvh; min-height:0; margin:0 auto; padding-block:6px; }
    body.game-running .screen.game { height:100%; min-height:0; }
    body.game-running .game-card { min-height:0; }
    button { font:inherit; touch-action:manipulation; }
    button:focus-visible { outline:4px solid rgba(255,107,53,.35); outline-offset:3px; }
    .app { width:min(100% - 24px,960px); min-height:calc(100vh - 24px); margin:12px auto; }
    .screen { display:none; min-height:calc(100vh - 24px); }
    .screen.active { display:flex; }
    .panel { width:100%; border:4px solid rgba(255,255,255,.88); border-radius:32px; background:rgba(255,255,255,.93); box-shadow:0 10px 0 rgba(48,43,103,.12),0 24px 60px rgba(48,43,103,.16); }
    .start { align-items:center; justify-content:center; text-align:center; padding:20px clamp(18px,5vw,54px); }
    .logo { width:92px; height:92px; display:grid; place-items:center; margin:0 auto 12px; border:4px solid white; border-radius:26px; background:linear-gradient(145deg,var(--purple),#8977ff); box-shadow:0 8px 0 var(--purple-dark); color:white; font-size:46px; transform:rotate(-3deg); }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; margin:4px 0 10px; padding:7px 14px; border:2px solid #bbb3ff; border-radius:999px; color:var(--purple-dark); background:#f0edff; font-size:14px; font-weight:900; }
    h1 { margin:0; color:var(--purple-dark); font-size:clamp(40px,8vw,68px); line-height:1.05; letter-spacing:.04em; text-shadow:3px 3px 0 #e8e3ff; }
    .lead { margin:12px auto 22px; color:var(--muted); font-size:clamp(16px,3vw,19px); font-weight:800; line-height:1.7; }
    .setup-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:760px; margin:auto; text-align:left; }
    .setup-card { padding:18px; border:2px solid var(--line); border-radius:22px; background:#fff; }
    .setup-card legend { padding:0 6px; font-size:16px; font-weight:900; color:var(--purple-dark); }
    .choice-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
    .choice { min-height:48px; border:2px solid #dcd6ef; border-radius:14px; color:#555d79; background:#f9f7ff; font-size:17px; font-weight:900; cursor:pointer; transition:.15s ease; }
    .choice:hover { transform:translateY(-2px); border-color:#9489ec; }
    .choice.selected { border-color:var(--purple); color:#fff; background:var(--purple); box-shadow:0 4px 0 var(--purple-dark); }
    .time-grid { grid-template-columns:repeat(3,1fr); }
    .start-button,.result-button { width:min(100%,420px); min-height:62px; margin-top:22px; border:0; border-radius:19px; color:white; background:linear-gradient(#ff894c,var(--orange)); box-shadow:0 7px 0 var(--orange-dark); font-size:21px; font-weight:900; cursor:pointer; transition:.15s ease; }
    .start-button:hover,.result-button:hover { transform:translateY(-2px); filter:brightness(1.04); }
    .start-button:active,.result-button:active { transform:translateY(6px); box-shadow:0 1px 0 var(--orange-dark); }
    .best-line { min-height:24px; margin:16px 0 0; color:#7a7393; font-size:14px; font-weight:800; }

    .game { flex-direction:column; gap:14px; }
    .game-top { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; padding:13px 18px; border:3px solid white; border-radius:24px; background:rgba(255,255,255,.92); box-shadow:0 6px 0 rgba(48,43,103,.1); }
    .stat { display:flex; align-items:center; gap:8px; font-weight:900; }
    .stat.right { justify-content:flex-end; }
    .stat-value { color:var(--purple); font-size:24px; }
    .sound,.quit { width:44px; height:44px; border:0; border-radius:50%; background:#f0edff; color:var(--purple-dark); font-size:21px; cursor:pointer; }
    .top-actions { display:flex; gap:8px; }
    .timer-wrap { position:relative; width:76px; height:76px; display:grid; place-items:center; border-radius:50%; background:conic-gradient(var(--orange) var(--timer-angle,360deg),#eee9f8 0); }
    .timer-wrap::after { content:""; position:absolute; inset:7px; border-radius:50%; background:white; }
    .timer { position:relative; z-index:1; color:var(--orange-dark); font-size:26px; font-weight:1000; }
    .track { position:relative; height:68px; overflow:hidden; border:3px solid white; border-radius:22px; background:linear-gradient(#88d9ff 0 58%,#9de18f 58% 72%,#d7b274 72%); box-shadow:0 5px 0 rgba(48,43,103,.1); }
    .cloud { position:absolute; top:10px; font-size:22px; opacity:.88; }
    .runner { position:absolute; left:14px; bottom:7px; z-index:2; font-size:36px; transform:translateX(var(--runner-x,0)) scaleX(-1); transition:transform .3s cubic-bezier(.2,.85,.4,1.25); filter:drop-shadow(0 3px 0 rgba(255,255,255,.7)); }
    .finish { position:absolute; right:15px; bottom:5px; font-size:40px; }
    .game-card { position:relative; flex:1; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr); gap:22px; padding:clamp(18px,4vw,34px); overflow:hidden; }
    .question-side { min-height:430px; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:26px; background:linear-gradient(145deg,#f0edff,#fff); }
    .mode-label { padding:7px 14px; border-radius:999px; color:var(--purple-dark); background:#e5e0ff; font-size:14px; font-weight:900; }
    .question { margin:22px 0 18px; font-size:clamp(56px,10vw,92px); font-weight:1000; letter-spacing:.02em; line-height:1; }
    .answer-box { width:min(80%,280px); min-height:88px; display:grid; place-items:center; border:4px solid #cbc3f5; border-radius:22px; color:var(--purple-dark); background:white; box-shadow:inset 0 3px 0 #f2efff; font-size:52px; font-weight:1000; }
    .answer-box.empty::after { content:"?"; color:#cbc4e5; }
    .combo { min-height:30px; margin-top:14px; color:var(--orange-dark); font-size:18px; font-weight:900; }
    .keypad-side { display:flex; flex-direction:column; justify-content:center; }
    .keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
    .key { min-height:67px; border:2px solid #dcd6ef; border-radius:17px; color:#3c4360; background:#fff; box-shadow:0 5px 0 #d9d3eb; font-size:27px; font-weight:1000; cursor:pointer; touch-action:none; -webkit-tap-highlight-color:transparent; transition:.08s ease; }
    .key:hover { border-color:#998de8; background:#f7f5ff; }
    .key:active { transform:translateY(4px); box-shadow:0 1px 0 #d9d3eb; }
    .key.clear { color:#8a5672; background:#fff1f6; }
    .key.submit { color:white; background:var(--purple); border-color:var(--purple); box-shadow:0 5px 0 var(--purple-dark); }
    .key.submit:disabled { opacity:.45; cursor:not-allowed; }
    .hint { margin:15px 0 0; color:var(--muted); text-align:center; font-size:13px; font-weight:800; }
    .feedback { position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; opacity:0; background:rgba(255,255,255,.18); transition:opacity .1s; }
    .feedback.show { opacity:1; }
    .feedback-badge { padding:20px 32px; border:4px solid white; border-radius:28px; color:white; box-shadow:0 10px 0 rgba(37,40,76,.16); font-size:34px; font-weight:1000; transform:scale(.7); animation:pop .32s ease forwards; }
    .feedback.correct .feedback-badge { background:#27b993; }
    .feedback.wrong .feedback-badge { background:#ef6464; }

    .result { align-items:center; justify-content:center; text-align:center; padding:26px clamp(18px,5vw,58px); }
    .trophy { margin-bottom:6px; font-size:76px; animation:bob 1.8s ease-in-out infinite; }
    .result h2 { margin:0; color:var(--purple-dark); font-size:clamp(34px,7vw,54px); }
    .result-score { margin:12px 0 6px; font-size:clamp(48px,10vw,78px); font-weight:1000; line-height:1; }
    .result-score span { color:var(--orange); }
    .stars { min-height:54px; color:#ffc928; font-size:42px; letter-spacing:8px; text-shadow:0 3px 0 #d99b12; }
    .message { margin:10px auto 18px; color:var(--muted); font-size:18px; font-weight:900; }
    .result-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:620px; margin:0 auto; }
    .result-stat { padding:14px 8px; border:2px solid var(--line); border-radius:18px; background:#faf9ff; }
    .result-stat strong { display:block; color:var(--purple); font-size:27px; }
    .result-stat span { font-size:13px; font-weight:900; color:var(--muted); }
    .new-best { display:none; margin:16px auto 0; width:max-content; padding:8px 15px; border-radius:999px; color:#8b5700; background:#fff0a6; font-weight:1000; }
    .new-best.show { display:block; }
    .result-actions { display:flex; justify-content:center; gap:12px; }
    .result-button.secondary { color:var(--purple-dark); background:#eeeaff; box-shadow:0 7px 0 #c9c1ef; }
    .confetti { position:fixed; top:-30px; z-index:10; pointer-events:none; font-size:24px; animation:fall 1.7s ease-in forwards; }

    /* iPadなどのタッチ端末では、数字を大きくして押し間違いを減らす */
    @media (pointer:coarse) and (min-width:701px) {
      .game { gap:8px; }
      .game-top { padding:7px 14px; }
      .timer-wrap { width:62px; height:62px; }
      .timer { font-size:22px; }
      .track { height:50px; flex:0 0 50px; }
      .runner,.finish { font-size:30px; }
      .game-card { grid-template-columns:minmax(210px,.65fr) minmax(430px,1.35fr); gap:16px; padding:16px; }
      .question-side { min-height:0; height:100%; }
      .question { margin:12px 0; font-size:clamp(58px,8vw,72px); }
      .answer-box { width:min(90%,340px); min-height:clamp(78px,14dvh,110px); font-size:clamp(60px,8vw,76px); }
      .combo { margin-top:8px; }
      .keypad-side { min-height:0; height:100%; }
      .keypad { flex:1; min-height:0; grid-template-rows:repeat(4,minmax(0,1fr)); gap:12px; }
      .key { min-height:0; border-width:3px; border-radius:22px; font-size:clamp(44px,6vw,52px); box-shadow:0 6px 0 #d9d3eb; }
      .key:active { transform:translateY(6px); box-shadow:0 1px 0 #d9d3eb; }
      .key.clear,.key.submit { font-size:28px; }
      .key.submit { box-shadow:0 6px 0 var(--purple-dark); }
      .hint { display:none; }
    }

    @keyframes pop { to { transform:scale(1); } }
    @keyframes bob { 50% { transform:translateY(-8px) rotate(3deg); } }
    @keyframes fall { to { transform:translateY(110vh) rotate(600deg); opacity:0; } }
    @media (max-width:700px) {
      .app,.screen { min-height:calc(100vh - 12px); }
      .app { width:min(100% - 12px,960px); margin:6px auto; }
      .panel { border-radius:25px; }
      .start { padding:18px 14px; }
      .logo { width:72px; height:72px; font-size:36px; border-radius:22px; }
      .setup-grid { grid-template-columns:1fr; gap:10px; }
      .setup-card { padding:13px; }
      .choice { min-height:42px; }
      .game { gap:8px; }
      .game-top { padding:8px 10px; }
      .stat { gap:4px; font-size:13px; }
      .stat-value { font-size:20px; }
      .timer-wrap { width:61px; height:61px; }
      .timer-wrap::after { inset:6px; }
      .timer { font-size:22px; }
      .sound,.quit { width:38px; height:38px; }
      .track { height:52px; }
      .runner,.finish { font-size:30px; }
      .game-card { grid-template-columns:1fr; gap:12px; padding:13px; }
      .question-side { min-height:210px; }
      .question { margin:13px 0; font-size:56px; }
      .answer-box { min-height:62px; font-size:38px; }
      .combo { margin-top:7px; font-size:15px; }
      .key { min-height:52px; font-size:23px; border-radius:14px; }
      .hint { display:none; }
      .result { padding:20px 14px; }
      .result-actions { flex-direction:column; align-items:center; gap:0; }
      .result-button { margin-top:12px; }
    }
    @media (max-height:710px) and (max-width:700px) {
      .game-top { padding-block:5px; }
      .track { display:none; }
      .question-side { min-height:165px; }
      .question { font-size:48px; }
      .answer-box { min-height:54px; }
      .key { min-height:45px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <main class="app">
    <section id="startScreen" class="screen active panel start" aria-labelledby="title">
      <div>
        <div class="logo" aria-hidden="true">×</div>
        <div class="eyebrow">⚡ 60秒でどこまでいける？</div>
        <h1 id="title">九九ダッシュ！</h1>
        <p class="lead">答えを入力して、自己ベストをめざそう！</p>
        <div class="setup-grid">
          <fieldset class="setup-card">
            <legend>どの段にする？</legend>
            <div id="danChoices" class="choice-grid" aria-label="練習する段">
              <button class="choice" data-dan="2">2</button><button class="choice" data-dan="3">3</button>
              <button class="choice" data-dan="4">4</button><button class="choice" data-dan="5">5</button>
              <button class="choice" data-dan="6">6</button><button class="choice" data-dan="7">7</button>
              <button class="choice" data-dan="8">8</button><button class="choice" data-dan="9">9</button>
              <button class="choice selected" data-dan="all" style="grid-column:span 4">ぜんぶ</button>
            </div>
          </fieldset>
          <fieldset class="setup-card">
            <legend>何秒チャレンジ？</legend>
            <div id="timeChoices" class="choice-grid time-grid" aria-label="制限時間">
              <button class="choice" data-time="30">30秒</button>
              <button class="choice selected" data-time="60">60秒</button>
              <button class="choice" data-time="90">90秒</button>
            </div>
          </fieldset>
        </div>
        <button id="startButton" class="start-button">よーい、スタート！</button>
        <p id="bestLine" class="best-line">まだ記録はありません。最初の記録を作ろう！</p>
      </div>
    </section>

    <section id="gameScreen" class="screen game" aria-label="九九タイムアタック">
      <header class="game-top">
        <div class="stat">正解 <span id="score" class="stat-value">0</span>問</div>
        <div id="timerWrap" class="timer-wrap" aria-label="残り時間"><span id="timer" class="timer">60</span></div>
        <div class="stat right"><span id="comboMini">0コンボ</span><div class="top-actions"><button id="soundButton" class="sound" aria-label="効果音を切る">🔊</button><button id="quitButton" class="quit" aria-label="ゲームをやめる">⌂</button></div></div>
      </header>
      <div class="track" aria-hidden="true"><span class="cloud" style="left:20%">☁️</span><span class="cloud" style="left:56%;top:5px">☁️</span><span id="runner" class="runner">🏃</span><span class="finish">🏁</span></div>
      <div class="panel game-card">
        <div class="question-side">
          <div id="modeLabel" class="mode-label">ぜんぶミックス</div>
          <div class="question"><span id="leftNumber">7</span> × <span id="rightNumber">8</span></div>
          <div id="answerBox" class="answer-box empty" aria-live="polite"></div>
          <div id="combo" class="combo"></div>
        </div>
        <div class="keypad-side">
          <div id="keypad" class="keypad" aria-label="答えを入力">
            <button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button>
            <button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button>
            <button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button>
            <button class="key clear" data-key="clear">けす</button><button class="key" data-key="0">0</button><button id="submitKey" class="key submit" data-key="submit" disabled>決定</button>
          </div>
          <p class="hint">キーボードの数字・Enterキーでも遊べます</p>
        </div>
        <div id="feedback" class="feedback" aria-live="assertive"><div id="feedbackBadge" class="feedback-badge"></div></div>
      </div>
    </section>

    <section id="resultScreen" class="screen panel result" aria-labelledby="resultTitle">
      <div>
        <div class="trophy" aria-hidden="true">🏆</div>
        <h2 id="resultTitle">ゴール！</h2>
        <div class="result-score"><span id="finalScore">0</span>問 正解！</div>
        <div id="stars" class="stars" aria-label="星3つ">★★★</div>
        <p id="resultMessage" class="message">すごい集中力！</p>
        <div class="result-stats">
          <div class="result-stat"><strong id="accuracy">0%</strong><span>正答率</span></div>
          <div class="result-stat"><strong id="maxCombo">0</strong><span>最大コンボ</span></div>
          <div class="result-stat"><strong id="bestScore">0</strong><span>ベスト</span></div>
        </div>
        <div id="newBest" class="new-best">✨ 自己ベスト更新！</div>
        <div class="result-actions">
          <button id="retryButton" class="result-button">もう一度！</button>
          <button id="menuButton" class="result-button secondary">段をえらぶ</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const screens = { start: $('startScreen'), game: $('gameScreen'), result: $('resultScreen') };
      let selectedDan = 'all';
      let selectedTime = 60;
      let timeLeft = selectedTime;
      let score = 0;
      let attempts = 0;
      let combo = 0;
      let maxCombo = 0;
      let answer = '';
      let current = { a: 7, b: 8 };
      let lastKey = '';
      let timerId = null;
      let running = false;
      let locked = false;
      let soundOn = true;
      let audio = null;

      function show(name) {
        Object.entries(screens).forEach(([key, el]) => el.classList.toggle('active', key === name));
        document.body.classList.toggle('game-running', name === 'game');
      }

      function bestKey() { return `kuku-best-${selectedDan}-${selectedTime}`; }
      function getBest() { return Number(localStorage.getItem(bestKey()) || 0); }
      function modeName() { return selectedDan === 'all' ? 'ぜんぶミックス' : `${selectedDan}の段`; }
      function updateBestLine() {
        const best = getBest();
        $('bestLine').textContent = best ? `${modeName()}・${selectedTime}秒のベストは ${best}問！` : 'まだ記録はありません。最初の記録を作ろう！';
      }

      function initAudio() {
        const Context = window.AudioContext || window.webkitAudioContext;
        if (!Context) return null;
        if (!audio) audio = new Context();
        if (audio.state === 'suspended') audio.resume();
        return audio;
      }

      function tone(frequency, start, duration, type = 'triangle', volume = .12) {
        if (!soundOn) return;
        const ctx = initAudio();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(frequency, ctx.currentTime + start);
        gain.gain.setValueAtTime(.0001, ctx.currentTime + start);
        gain.gain.exponentialRampToValueAtTime(volume, ctx.currentTime + start + .012);
        gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + start + duration);
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + start);
        osc.stop(ctx.currentTime + start + duration + .02);
      }

      function sound(kind) {
        if (kind === 'start') { tone(392,0,.18); tone(523,.1,.2); tone(659,.2,.24); }
        if (kind === 'correct') { tone(660,0,.13); tone(880,.09,.18); }
        if (kind === 'combo') { tone(660,0,.12); tone(880,.07,.15); tone(1100,.15,.22); }
        if (kind === 'wrong') { tone(230,0,.17,'sine',.1); tone(180,.12,.2,'sine',.09); }
        if (kind === 'finish') { [523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.3,'triangle',.13)); }
        if (kind === 'tap') tone(430,0,.06,'sine',.045);
      }

      function nextQuestion() {
        const a = selectedDan === 'all' ? Math.floor(Math.random()*8)+2 : Number(selectedDan);
        let b = Math.floor(Math.random()*9)+1;
        if (`${a}-${b}` === lastKey) b = b % 9 + 1;
        current = { a, b };
        lastKey = `${a}-${b}`;
        answer = '';
        $('leftNumber').textContent = a;
        $('rightNumber').textContent = b;
        renderAnswer();
      }

      function renderAnswer() {
        $('answerBox').textContent = answer;
        $('answerBox').classList.toggle('empty', !answer);
        $('submitKey').disabled = !answer;
      }

      function updateGameUI() {
        $('score').textContent = score;
        $('comboMini').textContent = `${combo}コンボ`;
        $('combo').textContent = combo >= 2 ? `🔥 ${combo}コンボ！` : '';
        const ratio = Math.max(0, timeLeft / selectedTime);
        $('timer').textContent = Math.ceil(timeLeft);
        $('timerWrap').style.setProperty('--timer-angle', `${ratio * 360}deg`);
        $('runner').style.setProperty('--runner-x', `${Math.min(78, score * 3.2)}vw`);
      }

      function startGame() {
        clearInterval(timerId);
        score = 0; attempts = 0; combo = 0; maxCombo = 0; answer = ''; locked = false; running = true; timeLeft = selectedTime;
        $('modeLabel').textContent = `${modeName()}・${selectedTime}秒`;
        nextQuestion(); updateGameUI(); show('game'); sound('start');
        const startedAt = performance.now();
        timerId = setInterval(() => {
          timeLeft = Math.max(0, selectedTime - (performance.now() - startedAt) / 1000);
          updateGameUI();
          if (timeLeft <= 0) endGame();
        }, 100);
      }

      function showFeedback(correct) {
        const feedback = $('feedback');
        feedback.className = `feedback show ${correct ? 'correct' : 'wrong'}`;
        $('feedbackBadge').textContent = correct ? (combo >= 5 ? `🔥 ${combo}コンボ！` : '○ せいかい！') : `△ ${current.a * current.b} だよ`;
        setTimeout(() => { feedback.className = 'feedback'; }, 300);
      }

      function submit() {
        if (!running || locked || !answer) return;
        locked = true;
        attempts += 1;
        const correct = Number(answer) === current.a * current.b;
        if (correct) {
          score += 1; combo += 1; maxCombo = Math.max(maxCombo, combo);
          sound(combo > 0 && combo % 5 === 0 ? 'combo' : 'correct');
        } else {
          combo = 0; sound('wrong');
        }
        updateGameUI(); showFeedback(correct);
        setTimeout(() => { if (running) { nextQuestion(); locked = false; } }, 315);
      }

      function endGame() {
        if (!running) return;
        running = false; locked = true; clearInterval(timerId); timeLeft = 0; updateGameUI(); sound('finish');
        const previousBest = getBest();
        const isNewBest = score > previousBest;
        if (isNewBest) localStorage.setItem(bestKey(), String(score));
        const accuracy = attempts ? Math.round(score / attempts * 100) : 0;
        $('finalScore').textContent = score;
        $('accuracy').textContent = `${accuracy}%`;
        $('maxCombo').textContent = maxCombo;
        $('bestScore').textContent = Math.max(previousBest, score);
        $('newBest').classList.toggle('show', isNewBest);
        const starCount = score >= selectedTime * .42 ? 3 : score >= selectedTime * .25 ? 2 : 1;
        $('stars').textContent = '★'.repeat(starCount) + '☆'.repeat(3-starCount);
        $('stars').setAttribute('aria-label', `星${starCount}つ`);
        $('resultMessage').textContent = score >= selectedTime * .42 ? 'ものすごい速さ！九九マスターだね！' : score >= selectedTime * .25 ? 'いい走り！もう一度で記録がのびそう！' : 'ナイスチャレンジ！ゆっくり確かめて、また走ろう！';
        show('result'); burst();
      }

      function burst() {
        const pieces = ['★','●','◆','✦'];
        for (let i=0;i<18;i+=1) {
          const el = document.createElement('span');
          el.className = 'confetti'; el.textContent = pieces[i%pieces.length];
          el.style.left = `${3 + Math.random()*94}%`; el.style.color = ['#ff6b35','#5b4bdb','#27b993','#ffc928'][i%4];
          el.style.animationDelay = `${Math.random()*.45}s`; document.body.appendChild(el);
          setTimeout(()=>el.remove(),2300);
        }
      }

      function goMenu() { running = false; clearInterval(timerId); updateBestLine(); show('start'); }

      $('danChoices').addEventListener('click', (event) => {
        const button = event.target.closest('[data-dan]'); if (!button) return;
        selectedDan = button.dataset.dan;
        document.querySelectorAll('[data-dan]').forEach(el=>el.classList.toggle('selected',el===button));
        sound('tap'); updateBestLine();
      });
      $('timeChoices').addEventListener('click', (event) => {
        const button = event.target.closest('[data-time]'); if (!button) return;
        selectedTime = Number(button.dataset.time);
        document.querySelectorAll('[data-time]').forEach(el=>el.classList.toggle('selected',el===button));
        sound('tap'); updateBestLine();
      });
      function pressKey(key) {
        if (locked) return;
        if (key === 'clear') answer = answer.slice(0,-1);
        else if (key === 'submit') return submit();
        else if (answer.length < 2) { answer += key; sound('tap'); }
        renderAnswer();
      }
      $('keypad').addEventListener('pointerdown', (event) => {
        const button = event.target.closest('[data-key]'); if (!button) return;
        event.preventDefault();
        pressKey(button.dataset.key);
      });
      $('keypad').addEventListener('click', (event) => {
        if (event.detail !== 0) return;
        const button = event.target.closest('[data-key]'); if (!button) return;
        pressKey(button.dataset.key);
      });
      window.addEventListener('keydown', (event) => {
        if (!running || locked) return;
        if (/^[0-9]$/.test(event.key) && answer.length < 2) { answer += event.key; sound('tap'); renderAnswer(); }
        else if (event.key === 'Backspace') { answer = answer.slice(0,-1); renderAnswer(); }
        else if (event.key === 'Enter') submit();
      });
      $('startButton').addEventListener('click', startGame);
      $('retryButton').addEventListener('click', startGame);
      $('menuButton').addEventListener('click', goMenu);
      $('quitButton').addEventListener('click', goMenu);
      $('soundButton').addEventListener('click', () => {
        soundOn = !soundOn; $('soundButton').textContent = soundOn ? '🔊' : '🔇';
        $('soundButton').setAttribute('aria-label',soundOn?'効果音を切る':'効果音をつける'); if(soundOn) sound('start');
      });
      updateBestLine();
    })();
  </script>
</body>
</html>
